plugins {
    id 'application'
}

group = 'fox'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'fox.Fox'
}

// Keep Fox's original executable tests as regression checks while adding proper
// JUnit tests for Gradle and IDE test discovery.
def foxTestClasses = [
        'fox.parser.TaskParserTest',
        'fox.storage.StorageTest',
        'fox.task.TaskListTest',
        'fox.FoxPersistenceTest'
]

tasks.named('test') {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
    doLast {
        foxTestClasses.each { testClass ->
            logger.lifecycle("Running Fox test ${testClass}")
            project.javaexec {
                classpath = sourceSets.test.runtimeClasspath
                mainClass = testClass
                enableAssertions = true
            }
        }
    }
}

tasks.named('jar') {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
}
